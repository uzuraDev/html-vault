name = "html-vault"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Serve on <name>.<your-subdomain>.workers.dev by default
workers_dev = true

# Bundle public/index.html into the Worker as a text module
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

# KV: snippet bodies + metadata index
# Replace the id with the one printed by:
#   npx wrangler kv namespace create VAULT
# (The "Deploy to Cloudflare" button replaces this placeholder automatically.)
kv_namespaces = [
  { binding = "VAULT", id = "REPLACE_AFTER_KV_CREATE" }
]

# Optional: strongly consistent session revocation.
#
# By default, logout records the revoked session in KV. KV is eventually
# consistent (60s read cache), so a stolen cookie can still be replayed at
# another edge location for up to about a minute after you log out.
#
# Uncomment both blocks below to keep the revocation list in a Durable Object
# instead. A DO serializes reads and writes through one instance, so logout
# takes effect everywhere immediately. The cost is one extra round trip to the
# DO on every authenticated request. The code picks the DO automatically when
# the binding exists — nothing else to change.
#
# [[durable_objects.bindings]]
# name = "SESSION_REVOCATIONS"
# class_name = "SessionRevocations"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["SessionRevocations"]

# Plain (non-secret) vars. Set DEMO_MODE = "1" to run a read-only public demo.
# WARNING: DEMO_MODE makes every snippet in the bound KV namespace publicly
# readable without login. Only enable it with a dedicated demo namespace
# (seeded via scripts/seed-demo.mjs) — never against your real vault data.
#
# UI_HIDE_NEW = "1" hides the "New snippet" item in the ⋯ menu — handy when you
# upload through MCP and want the browser UI to stay read-ish. The element stays
# in the DOM (CSS-hidden) and the write APIs are NOT blocked; `n` still opens the
# new-snippet modal.
# [vars]
# DEMO_MODE = "1"
# UI_HIDE_NEW = "1"

# Optional: serve on your own domain instead of workers.dev.
# routes = [
#   { pattern = "vault.example.com/*", zone_name = "example.com" }
# ]
