<!DOCTYPE html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{docTitle}}</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --txt:#e7ebf0; --muted:#9aa3b2; --accent:#5b9dff; --accent2:#3b7ddd;
    --danger:#ff6b6b; --ok:#43c59e; --radius:14px;
    /* スクロールバー用。--line より一段明るくして、つまみが背景に沈まないようにする */
    --scroll-thumb:#39404e; --scroll-thumb-hover:#4b5464;
    /* サイドバー幅。ドラッグハンドルが :root 側のこの値を書き換える
       (.sidebar に直接当てるとモバイルの width:100% に勝ってしまうため) */
    --sb-w:340px;
    color-scheme: dark;
    /* モーション。値は worker/public/index.html と完全に同一にすること */
    --dur-1:120ms;   /* 状態変化: hover / active / focus / 行アクションの出現 */
    --dur-2:180ms;   /* 出入り: モーダル、トースト、プレビューのフェード */
    --ease-out:cubic-bezier(.22,.61,.36,1);
    --ease-in:cubic-bezier(.55,.06,.68,.19);
    --ease-std:cubic-bezier(.4,0,.2,1);
  }
  /* OSでモーション低減が有効なら、動きは出さず状態変化だけ即座に反映する */
  @media (prefers-reduced-motion: reduce){
    :root{ --dur-1:0ms; --dur-2:0ms; }
    *,*::before,*::after{
      animation-duration:.01ms!important; animation-iteration-count:1!important;
      transition-duration:.01ms!important;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;border-radius:10px;padding:9px 14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  button.primary{background:var(--accent2);border-color:var(--accent2)}
  button.primary:hover{background:var(--accent)}
  button.ghost{background:transparent}
  button.danger{background:transparent;border-color:#5a2b30;color:var(--danger)}
  button{transition:background-color var(--dur-1) var(--ease-std),
                   border-color var(--dur-1) var(--ease-std),
                   color var(--dur-1) var(--ease-std),
                   transform var(--dur-1) var(--ease-out)}
  button:active{transform:translateY(1px)}
  input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input,textarea{transition:border-color var(--dur-1) var(--ease-std),
                            box-shadow var(--dur-1) var(--ease-std)}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.18)}
  /* outline:none で消した UA のフォーカスリングを、キーボード操作時だけ戻す */
  button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  textarea{resize:vertical;min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  /* iOS Safari は font-size 16px 未満の入力欄にフォーカスするとページ全体をズームし、
     blur してもスケールが戻らない (タブにも記憶される)。横向き(852-932px)も含め
     全幅で効かせるため無条件に当て、ポインタのあるデスクトップだけ元の値に戻す。
     ※ 上の textarea 規則と同じ詳細度なので、必ずこの位置 (後ろ) に置くこと。 */
  input,textarea,select{font-size:16px}
  @media (min-width:761px) and (hover:hover){
    input,select{font-size:15px}
    textarea{font-size:13px}
  }
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center}
  .wrap{display:flex;flex-direction:column;height:100%}

  /* サイドバー上部: ブランド + 開閉トグル(右寄せ・コンパクト) */
  /* safe-area: viewport-fit=cover を宣言しているので、ノッチ/ホームインジケータ分を
     env() で足す。ノッチは横向きだと左右に来るため幅の media query では囲わない。
     env() 非対応ブラウザ向けに、素の padding 宣言を必ず先に残しておく。 */
  .sidebar-head{display:flex;align-items:center;gap:8px;padding:11px 12px 11px 14px;border-bottom:1px solid var(--line);padding-top:calc(11px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  .sidebar-head h1{flex:1;min-width:0;font-size:14px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--muted);flex:none;transition:color var(--dur-1) var(--ease-std),border-color var(--dur-1) var(--ease-std),background var(--dur-1) var(--ease-std)}
  .icon-btn:hover{color:var(--txt);border-color:var(--accent);background:var(--panel2)}
  .icon-btn svg{width:16px;height:16px;display:block}
  #menuBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* アカウントメニュー: ログアウトのような低頻度操作は常時表示せず、押したときだけ出す */
  .menu-wrap{position:relative;flex:none}
  .menu{position:absolute;top:calc(100% + 6px);right:0;z-index:10;min-width:168px;
        padding:6px;background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  /* min-height: 常時表示のボタンから移してきた項目 (新規作成) のタップ領域を確保する。
     white-space:nowrap: 長いラベルで2行に折り返させない
     (.menu の min-width より広くなるぶんはメニュー側が伸びる) */
  .menu-item{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start;
             padding:8px 10px;background:transparent;border:1px solid transparent;
             color:var(--muted);border-radius:9px;min-height:36px;white-space:nowrap}
  .menu-item:hover{background:var(--panel);color:var(--txt);border-color:var(--line)}
  .menu-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .menu-item svg{width:16px;height:16px;flex:none}
  /* サイドバー幅のドラッグハンドル (右端に重ねる。モバイルは全幅なので出さない) */
  .sb-resizer{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
  .sb-resizer:hover{background:var(--accent2)}
  /* 折りたたみ時にコンテンツ左上へ出す「開く」ボタン */
  .expand-btn{position:absolute;top:10px;left:10px;z-index:6;display:none;background:var(--panel);box-shadow:0 1px 6px rgba(0,0,0,.35)}

  /* レイアウト */
  main{flex:1;display:flex;min-height:0}
  .sidebar{width:var(--sb-w);position:relative;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  /* min-width:0 が無いと flex item の既定 min-width:auto でプレビューの中身に
     押し広げられ、body ごと横スクロールする */
  .content{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
  /* 並び替え / 絞り込み。検索欄の上に横並びで置く。押すと .menu (⋯ メニューと同じ部品) が開く。
     項目は JS が組み立てる (タグは実データ由来で、件数も変わるため) */
  .filterbar{display:flex;gap:8px;padding:10px 12px 0}
  .fb-wrap{position:relative;flex:1;min-width:0}
  .fb-btn{display:flex;align-items:center;gap:6px;width:100%;height:34px;padding:0 10px;font-size:12px;
          color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:9px}
  .fb-btn:hover{color:var(--txt);border-color:var(--accent)}
  .fb-btn svg{width:14px;height:14px;flex:none}
  /* サイドバーは 240px まで狭められる。ラベルは潰れてよい (状態は色とバッジでも分かる) */
  .fb-btn .fb-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  /* 既定から動いている軸はアクセント色にして、メニューを畳んでいても効いていると分かるようにする */
  .fb-btn.on{color:var(--accent);border-color:var(--accent2)}
  /* 絞り込みの選択数 (タグ数 + ピン留めのみ) */
  .fb-count{flex:none;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent2);
            color:#fff;font-size:10px;line-height:16px;text-align:center}
  /* 親 (.fb-wrap) が狭いので ⋯ メニューの min-width は使わず中身なりに広げる。
     並び替えは左端、絞り込みは右端 (.menu の既定) に寄せて、どちらもサイドバーの内側へ落とす */
  .fb-wrap .menu{min-width:0;width:max-content;max-width:260px;max-height:min(50vh,320px);overflow:auto}
  #sortMenu{left:0;right:auto}
  .menu-sep{height:1px;margin:5px 4px;background:var(--line)}
  /* チェック印の桁は常に確保する。選択の有無でラベルが横にずれると読みにくい */
  .menu-item .check{flex:none;width:14px;text-align:center;color:var(--accent)}
  /* タグ名は長いものがあるので項目の中で省略記号に落とす (全文は title 属性で読める) */
  .menu-item .mi-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .menu-item .mi-count{flex:none;color:var(--muted);font-size:11px}
  /* タグが1件も無いときの案内。ボタンではないのでホバーにも反応させない */
  .menu-item[aria-disabled="true"]{color:var(--muted);cursor:default}
  .menu-item[aria-disabled="true"]:hover{background:transparent;border-color:transparent;color:var(--muted)}
  /* 中身は検索欄だけ (新規作成は ⋯ メニューへ移した)。input は width:100% なので
     flex にせず素のブロックで受ける。inline 要素のままだと行送りぶんの隙間が下に出る。
     上は .filterbar と間を詰める (.filterbar 側が下 padding を持たない) */
  .toolbar{padding:8px 12px 10px;border-bottom:1px solid var(--line)}
  /* タップ領域 40px。幅の media query では囲わない (横向きのスマホも対象にする) */
  .toolbar input{height:40px;display:block}
  /* type="search" のネイティブ装飾を無効化し、他の input と同じ見た目に揃える */
  .toolbar input[type=search]{-webkit-appearance:none;appearance:none}
  .toolbar input[type=search]::-webkit-search-decoration{-webkit-appearance:none}
  /* 本文検索の進行状況 (検索中 / 打ち切り)。非表示時は .hide で高さごと消す */
  .search-status{padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
  /* UI_HIDE_NEW=1 でビルドしたとき（MCP 中心運用向け）。要素は DOM に残し、表示だけ消す。
     #newBtn は ⋯ メニュー内の項目なので、隠すとメニューはログアウトだけになる
     （setMenu が「表示されている最初の項目」へフォーカスする） */
  body.hide-new #newBtn{display:none!important}
  /* ログアウトをヘッダへ移して .sidebar-foot が無くなったぶん、一覧が画面下端まで
     伸びる。ホームインジケータに最後の行が隠れないよう safe-area を一覧側で受ける */
  .list{overflow:auto;flex:1;padding-bottom:env(safe-area-inset-bottom)}
  /* スクロールバー: UIのトーンに合わせる。トラックは透明にして
     各要素の背景 (.list=--panel) をそのまま透かす */
  .list,.modal-body,textarea,.menu{
    scrollbar-width:thin;
    scrollbar-color:var(--scroll-thumb) transparent;
  }
  .list::-webkit-scrollbar,.modal-body::-webkit-scrollbar,
  textarea::-webkit-scrollbar,.menu::-webkit-scrollbar{width:10px;height:10px}
  .list::-webkit-scrollbar-track,.modal-body::-webkit-scrollbar-track,
  textarea::-webkit-scrollbar-track,.menu::-webkit-scrollbar-track{background:transparent}
  .list::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb,
  textarea::-webkit-scrollbar-thumb,.menu::-webkit-scrollbar-thumb{
    background:var(--scroll-thumb);border-radius:999px;
    border:2px solid transparent;background-clip:padding-box;
  }
  .list::-webkit-scrollbar-thumb:hover,.modal-body::-webkit-scrollbar-thumb:hover,
  textarea::-webkit-scrollbar-thumb:hover,.menu::-webkit-scrollbar-thumb:hover{
    background:var(--scroll-thumb-hover);background-clip:padding-box;
  }
  .list::-webkit-scrollbar-corner,.modal-body::-webkit-scrollbar-corner,
  textarea::-webkit-scrollbar-corner,.menu::-webkit-scrollbar-corner{background:transparent}
  /* 一覧の行は「タイトル1行」だけを持ち、高さは全行そろえて固定する。
     更新日/バイト数/タグ/抜粋は行から外し、プレビュー上部の .detail 帯へ移した
     (それらを行に置くと折り返し・抜粋の有無で行ごとに高さが変わる)。
     高さはボーダー込みで数えたいので box-sizing:border-box。 */
  .item{position:relative;box-sizing:border-box;height:46px;display:flex;align-items:center;
        padding:0 14px;border-bottom:1px solid var(--line);cursor:pointer;
        transition:background-color var(--dur-1) var(--ease-std),box-shadow var(--dur-1) var(--ease-std)}
  .item:hover{background:var(--panel2)}
  /* 選択マーカーは border-left ではなく inset box-shadow。border だと幅を占有して
     選択した瞬間に行の中身が3px右へずれる */
  .item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .item.dragging{opacity:.45;transition:opacity var(--dur-1) var(--ease-out)}
  .item .t{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding-right:100px}
  /* 省略記号はタイトル文字列側に付ける。本文ヒットのバッジは .t の直下に並べて縮ませない
     (.t 自体を nowrap+ellipsis にすると、長いタイトルの行でバッジごと切り落とされる) */
  .item .t .t-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .t .tag{flex:none}
  /* 行アクション (ピン/DL/削除): 通常は隠し、ホバー/選択時に右端へアイコン表示。
     行が固定高になったので top 固定ではなく上下中央に置く */
  .item .del-item,.item .dl-item,.item .pin-item{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--muted);opacity:0;transition:opacity var(--dur-1) var(--ease-std),background var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),border-color var(--dur-1) var(--ease-std)}
  .item .del-item{right:8px}
  .item .dl-item{right:40px}
  .item .pin-item{right:72px}
  .item:hover .del-item,.item.active .del-item,.item:hover .dl-item,.item.active .dl-item,.item:hover .pin-item,.item.active .pin-item{opacity:1}
  /* キーボードで行アクションに来たときも見えるようにする (opacity:0 のままだとフォーカスリングごと見えない) */
  .item .del-item:focus-visible,.item .dl-item:focus-visible,.item .pin-item:focus-visible{opacity:1}
  .item .del-item:hover{background:rgba(255,107,107,.14);border-color:#5a2b30;color:var(--danger)}
  .item .dl-item:hover{background:rgba(91,157,255,.14);border-color:var(--accent2);color:var(--accent)}
  .item .pin-item:hover{background:rgba(91,157,255,.14);border-color:var(--accent2);color:var(--accent)}
  .item .del-item svg,.item .dl-item svg,.item .pin-item svg{width:15px;height:15px;display:block}
  /* ピン留め中はホバーしなくても常時表示 (塗りつぶし + アクセント色) */
  .item .pin-item.pinned{opacity:1;color:var(--accent)}
  .item .pin-item.pinned svg{fill:currentColor}
  /* タッチ端末はホバーが無いので常時うっすら表示 */
  @media (hover:none){ .item .del-item,.item .dl-item,.item .pin-item{opacity:.5} .item .pin-item.pinned{opacity:1} }
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10px}
  .tag.body{background:transparent;border-color:var(--accent2);color:var(--accent)}

  /* ビュー切替 */
  .tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(12px + env(safe-area-inset-left))}
  .tabs button{font-size:13px;padding:6px 12px}
  /* 選択中スニペットの詳細帯。一覧の行から外した 更新日/バイト数/タグ をここへ集約し、
     本文検索でその行が本文ヒットなら抜粋も出す。未選択のときは .tabs と同じく出さない
     (display は renderDetail() が切り替える) */
  .detail{display:none;align-items:center;flex-wrap:wrap;gap:5px 10px;font-size:11px;color:var(--muted);
          padding:7px 12px;padding-left:calc(12px + env(safe-area-inset-left));
          border-bottom:1px solid var(--line)}
  /* タグも抜粋と同じく2行で打ち切る。タグ数は上限が無いので、折り返しに任せると
     帯がタグの数だけ伸びてプレビューを押し下げる (タグ1行 ≒ 20px + 行間4px で2行ぶん = 44px)。
     入りきらないぶんは title 属性のツールチップで読めるようにしてある */
  .detail .d-tags{display:flex;flex-wrap:wrap;gap:4px;min-width:0;max-height:44px;overflow:hidden}
  .detail .tag{flex:none}
  /* 抜粋は必ず行頭から2行まで。帯が伸び続けないようにクランプする。
     min-height も同じ2行ぶんに揃えて、抜粋の有無や行数で帯の高さが変わらないようにする
     (本文検索中は 打鍵→ローカル絞り込み→サーバー応答 で抜粋が消えては戻るため、
      高さを可変にするとプレビューが打鍵のたびに上下に跳ねる) */
  .detail .d-excerpt{flex-basis:100%;min-height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
  .detail .d-excerpt mark{background:rgba(91,157,255,.28);color:var(--txt);border-radius:3px;padding:0 1px}
  .view{flex:1;min-height:0;display:flex;flex-direction:column}
  /* プレビューは読み込み完了 (.loaded) までは透明にして、白面のちらつきを出さない */
  iframe{flex:1;border:0;width:100%;background:#fff;border-radius:0;color-scheme:light;
         opacity:0;transition:opacity var(--dur-2) var(--ease-out)}
  iframe.loaded{opacity:1}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px}

  /* モーダル (ヘッダ / スクロールする本文 / 固定フッタ の3段。余分な余白を作らない) */
  /* display 切替だと transition が効かないので opacity/visibility で出し入れする。
     visibility を必ずセットにすること。opacity:0 だけだと非表示のはずのオーバーレイが
     画面全体のクリックを奪ってしまう。
     padding は素の 16px を先に置き、safe-area 込みの値で上書きする (env() 非対応向け) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(2px);
           padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
           opacity:0;visibility:hidden;
           transition:opacity var(--dur-2) var(--ease-in),visibility 0s linear var(--dur-2)}
  .overlay.show{opacity:1;visibility:visible;
                transition:opacity var(--dur-2) var(--ease-out),visibility 0s}
  .overlay .modal{transform:translateY(8px) scale(.98);
                  transition:transform var(--dur-2) var(--ease-in)}
  .overlay.show .modal{transform:none;transition:transform var(--dur-2) var(--ease-out)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:min(640px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden}
  .modal h2{margin:0;font-size:16px;font-weight:600;padding:15px 18px;border-bottom:1px solid var(--line)}

  /* ログイン */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}

  /* 操作結果の通知レイヤー。alert() と違ってフローを止めない */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
         background:var(--panel2);border:1px solid var(--line);border-radius:10px;
         padding:10px 16px;font-size:13px;z-index:40;opacity:0;visibility:hidden;pointer-events:none;
         transition:opacity var(--dur-2) var(--ease-in),transform var(--dur-2) var(--ease-in),visibility 0s linear var(--dur-2)}
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);
              transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out),visibility 0s}
  .toast.err{border-color:#5a2b30;color:var(--danger)}

  .hide{display:none!important}

  /* モバイル対応 (一覧 ⇆ 詳細 の切替表示) */

  }

  /* デスクトップ: サイドバーの折りたたみ */
  @media (min-width:761px){
    .wrap.sb-collapsed .sidebar{display:none}
    .wrap.sb-collapsed .expand-btn{display:flex}
    /* サイドバーを畳むと .expand-btn (絶対配置・左上 10px + 32px) が詳細帯の頭に重なるので、その分だけ空ける。
       素の .detail が持つ safe-area の逃げを消さないよう calc に足す (ノッチ端末の横向きは 761px 以上になる) */
    .wrap.sb-collapsed .detail{padding-left:calc(52px + env(safe-area-inset-left))}

<body class="{{__BODY_CLASS__}}">

<!-- ログイン画面 -->
<div class="login" id="loginView">

<!-- アプリ本体 -->
<div class="wrap hide" id="appView">
  <main>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h1>📁 HTML Vault</h1>
        <div class="menu-wrap">
          <button class="icon-btn" id="menuBtn" type="button" title="{{accountMenu}}" aria-label="{{accountMenu}}" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
          <!-- 項目の並びは使用頻度順 (新規作成 → ログアウト)。
               setMenu(true) は「表示されている最初の項目」へフォーカスする。
               ラベルが可視テキストなので title / aria-label は付けない (二重読みになる)。
               tabindex="-1": role="menu" のフォーカス移動は上下キー (moveMenuFocus) が担当し、
               Tab はメニューの外へ抜ける = focusout で閉じる、という ARIA の作法に合わせる -->
          <div class="menu hide" id="accountMenu" role="menu">
            <button class="menu-item" id="newBtn" type="button" role="menuitem" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span>{{newTitle}}</span></button>
            <button class="menu-item" id="logoutBtn" type="button" role="menuitem" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>{{logout}}</span></button>
          </div>
        </div>
        <button class="icon-btn" id="collapseBtn" title="{{collapseMenu}}" aria-label="{{collapseMenu}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
      </div>
      <!-- 並び替え / 絞り込み。中身 (項目・ラベル・件数バッジ) は renderSortMenu() /
           renderFilterMenu() が組む -->
      <div class="filterbar">
        <div class="fb-wrap">
          <button class="fb-btn" id="sortBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sortMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10"/><path d="M3 12h7"/><path d="M3 18h4"/><path d="M17 4v16"/><path d="M14 17l3 3 3-3"/></svg><span class="fb-label" id="sortLabel"></span></button>
          <div class="menu hide" id="sortMenu" role="menu" aria-label="{{sortMenuLabel}}"></div>
        </div>
        <div class="fb-wrap">
          <button class="fb-btn" id="filterBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="filterMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg><span class="fb-label" id="filterLabel"></span><span class="fb-count hide" id="filterCount"></span></button>
          <div class="menu hide" id="filterMenu" role="menu" aria-label="{{filterMenuLabel}}"></div>
        </div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="{{searchPlaceholder}}" aria-label="{{searchPlaceholder}}">
      </div>
      <div class="search-status hide" id="searchStatus" aria-live="polite"></div>
      <div class="list" id="list"></div>
      <div class="sb-resizer" id="sbResizer"></div>
    </aside>

    <section class="content hidden-mobile" id="content">
      <button class="icon-btn expand-btn" id="expandBtn" title="{{expandMenu}}" aria-label="{{expandMenu}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
      <div class="tabs" id="tabs" style="display:none">
        <button class="mobile-back" id="backBtn">{{backToList}}</button>
      </div>
      <!-- 選択中スニペットの詳細 (更新日/バイト数/タグ/本文ヒットの抜粋)。中身は renderDetail() が組む。
           行から日付/サイズ/タグが消えた分、選択の切替を支援技術にも伝えるため aria-live を付ける
           (読み上げが騒がしくならないよう、renderDetail() は中身が実際に変わったときだけ書き換える) -->
      <div class="detail" id="detail" role="group" aria-live="polite" aria-label="{{detailBar}}"></div>
      <div class="view" id="view">

<!-- 新規/編集モーダル -->
<div class="overlay" id="modal">

<!-- 操作結果の通知 (成功も失敗も。role=status で読み上げにも乗せる) -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// i18n: ビルド時に選択言語の文言が焼き込まれる（scripts/build-i18n.mjs）
const T = {{__T_JSON__}};
const $ = (id) => document.getElementById(id);
let CSRF = null;
let SNIPPETS = [];
let SEARCH_RESULTS = null; // 非nullなら全文検索結果を表示中
let SEARCH_Q = '';         // 現在の検索語 (ハイライト用)
let currentId = null;
let editingId = null;
let DETAIL_HTML = ''; // 詳細帯に今入っている HTML。aria-live の無駄な読み上げを避ける差分判定用

// ---- トースト (操作結果の通知) ----
// alert() と違ってフローを止めないので、成功時の通知にも使える。
let toastTimer = null;
function toast(msg, isErr){
  const el = $('toast'); el.textContent = msg;
  el.classList.toggle('err', !!isErr); el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

// localStorage (端末ごとに独立。サイドバー開閉状態の保持に使用)
function lsGet(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch{} }

// ---- 並び替え / 絞り込み (端末ごとに localStorage へ保持) --------------------
// 既定の 'manual' はサーバーが返した順そのまま = ピン留めが先頭、その後は D&D で保存した order。
// manual 以外を選んでいる間と、絞り込みが効いている間は D&D を無効にする:
//   - 表示順とサーバー上の order が食い違うので、ドロップ位置をどう保存すべきか決まらない
//   - persistOrder() は表示中の行の ID だけを送るため、絞り込みで隠れた行の順序が壊れる
const SORTS = ['manual','updatedDesc','updatedAsc','titleAsc'];
const SORT_KEY = { manual:'sortManual', updatedDesc:'sortUpdatedDesc', updatedAsc:'sortUpdatedAsc', titleAsc:'sortTitleAsc' };
const LS_SORT = 'hv:sort';
const LS_PINNED_ONLY = 'hv:pinnedOnly';
const LS_TAGS = 'hv:tagFilter';
let SORT = (function(){ const v = lsGet(LS_SORT); return SORTS.indexOf(v) !== -1 ? v : 'manual'; })();
let PINNED_ONLY = lsGet(LS_PINNED_ONLY) === '1';
// タグは大文字小文字を無視して突き合わせるので、小文字化したキーで持つ
let TAG_FILTER = (function(){
  try{
    const a = JSON.parse(lsGet(LS_TAGS) || '[]');
    return new Set(Array.isArray(a) ? a.filter(x=>typeof x === 'string') : []);
  }catch{ return new Set(); }
})();
function saveSort(){ lsSet(LS_SORT, SORT); }
function saveFilters(){
  lsSet(LS_PINNED_ONLY, PINNED_ONLY ? '1' : '');
  lsSet(LS_TAGS, JSON.stringify([...TAG_FILTER]));
}
function tagsOf(s){ return (s.tags||'').split(',').map(x=>x.trim()).filter(Boolean); }
function filtersActive(){ return PINNED_ONLY || TAG_FILTER.size > 0; }
function dragEnabled(){ return SORT === 'manual' && !filtersActive(); }
// タイトルの比較。数字は数値として見る (page2 が page10 より前に来るように)
function titleCmp(a,b){
  return String(a.title||'').localeCompare(String(b.title||''), undefined, { numeric:true, sensitivity:'base' });
}
// 絞り込み → 並び替え の順に通した表示行。検索中は SEARCH_RESULTS が入力になる。
function visibleRows(){
  let rows = SEARCH_RESULTS !== null ? SEARCH_RESULTS : SNIPPETS;
  if(PINNED_ONLY) rows = rows.filter(s=>!!s.pinned);
  if(TAG_FILTER.size){
    // 複数選択は AND (選んだタグを全部持つものだけ残す)
    const want = [...TAG_FILTER];
    rows = rows.filter(s=>{
      const keys = tagsOf(s).map(x=>x.toLowerCase());
      return want.every(k=>keys.indexOf(k) !== -1);
    });
  }
  if(SORT === 'manual') return rows; // サーバーが決めた表示順をそのまま使う (既定の挙動)
  const cmp = SORT === 'updatedDesc' ? (a,b)=>b.updated-a.updated
    : SORT === 'updatedAsc' ? (a,b)=>a.updated-b.updated
    : titleCmp;
  // ピン留めはどの軸でも先頭に固定する (サーバー側の並びと揃える)
  return rows.slice().sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0)) || cmp(a,b));
}
// 実在しないタグを選んだままだと結果が常に0件になり、一覧から抜け出せなくなる。
// スニペットの削除・タグ編集で消えたものは読み込みのたびに落とす。
function pruneTagFilter(){
  if(!TAG_FILTER.size) return;
  const live = new Set();
  for(const s of SNIPPETS) for(const name of tagsOf(s)) live.add(name.toLowerCase());
  let changed = false;
  for(const k of [...TAG_FILTER]) if(!live.has(k)){ TAG_FILTER.delete(k); changed = true; }
  if(changed) saveFilters();
}
// タグ一覧は常に SNIPPETS 全体から作る (絞り込み後から作ると、一度絞ったら他のタグを選べなくなる)。
// 表示名は最初に現れた綴りを採用し、件数は大文字小文字を無視して数える。
function allTags(){
  const m = new Map(); // key(小文字) -> { label, n }
  for(const s of SNIPPETS){
    for(const name of tagsOf(s)){
      const key = name.toLowerCase();
      const cur = m.get(key);
      if(cur) cur.n++; else m.set(key, { label:name, n:1 });
    }
  }
  return [...m.entries()].map(([key,v])=>({ key, label:v.label, n:v.n }))
    .sort((a,b)=>titleCmp({ title:a.label }, { title:b.label }));
}
function setSort(v){
  if(SORTS.indexOf(v) === -1) return;
  SORT = v; saveSort();
  renderSortMenu(); renderList();
}
function toggleTag(key){
  if(TAG_FILTER.has(key)) TAG_FILTER.delete(key); else TAG_FILTER.add(key);
  saveFilters();
}
function setPinnedOnly(v){ PINNED_ONLY = !!v; saveFilters(); }
function clearFilters(){ PINNED_ONLY = false; TAG_FILTER.clear(); saveFilters(); }

// 並び替えメニュー。項目は固定で、選択中に ✓ を付ける。
function renderSortMenu(){
  $('sortMenu').innerHTML = SORTS.map(k=>{
    const on = SORT === k;
    return `<button class="menu-item" type="button" role="menuitemradio" tabindex="-1" data-sort="${esc(k)}" aria-checked="${on?'true':'false'}">`
      + `<span class="check">${on?'✓':''}</span><span class="mi-label">${esc(T[SORT_KEY[k]])}</span></button>`;
  }).join('');
  $('sortLabel').textContent = T[SORT_KEY[SORT]];
  $('sortBtn').classList.toggle('on', SORT !== 'manual');
}
// 絞り込みメニュー: ピン留めのみ / タグ (複数選択・AND) / 解除。
// 押すたびに作り直すので、開いたまま操作されたときのフォーカス復帰は呼び出し側で面倒を見る。
function renderFilterMenu(){
  const tags = allTags();
  let html = `<button class="menu-item" type="button" role="menuitemcheckbox" tabindex="-1" data-pinned="1" aria-checked="${PINNED_ONLY?'true':'false'}">`
    + `<span class="check">${PINNED_ONLY?'✓':''}</span><span class="mi-label">${esc(T.filterPinnedOnly)}</span></button>`
    + '<div class="menu-sep"></div>';
  if(tags.length === 0){
    html += `<div class="menu-item" aria-disabled="true"><span class="check"></span><span class="mi-label">${esc(T.filterNoTags)}</span></div>`;
  }else{
    html += tags.map(tg=>{
      const on = TAG_FILTER.has(tg.key);
      return `<button class="menu-item" type="button" role="menuitemcheckbox" tabindex="-1" data-tag="${esc(tg.key)}" aria-checked="${on?'true':'false'}">`
        + `<span class="check">${on?'✓':''}</span><span class="mi-label" title="${esc(tg.label)}">${esc(tg.label)}</span>`
        + `<span class="mi-count">${tg.n}</span></button>`;
    }).join('');
  }
  if(filtersActive()){
    html += '<div class="menu-sep"></div>'
      + '<button class="menu-item" type="button" role="menuitem" tabindex="-1" data-clear="1">'
      + `<span class="check"></span><span class="mi-label">${esc(T.filterClear)}</span></button>`;
  }
  menuRerendering = true; // 中身の入れ替えで飛ぶ focusout でメニューを閉じさせない
  try{ $('filterMenu').innerHTML = html; } finally { menuRerendering = false; }
  const n = TAG_FILTER.size + (PINNED_ONLY ? 1 : 0);
  $('filterCount').textContent = String(n);
  $('filterCount').classList.toggle('hide', n === 0);
  $('filterBtn').classList.toggle('on', n > 0);
  $('filterLabel').textContent = T.filterButton;
}

async function api(method, url, body, isForm, signal){
  const opts = { method, headers:{} };
  if (CSRF && method !== 'GET') opts.headers['x-csrf-token'] = CSRF;
  if (body && !isForm){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  if (body && isForm){ opts.body = body; }
  if (signal) opts.signal = signal; // 検索の打ち切り用 (AbortController)
  const r = await fetch(url, opts);
  const ct = r.headers.get('content-type')||'';
  const data = ct.includes('application/json') ? await r.json() : await r.text();
  if(!r.ok){ throw new Error((data && data.error) || (T.errorPrefix+' '+r.status)); }
  return data;
}

// ---- 認証 ----
async function checkAuth(){
  const me = await api('GET','/api/me');
  if(me.authed){ CSRF = me.csrf; showApp(); }
  else { $('loginView').classList.remove('hide'); $('appView').classList.add('hide'); }
}
async function login(){
  $('loginErr').textContent='';
  try{
    const r = await api('POST','/api/login',{ password: $('pw').value });
    CSRF = r.csrf; $('pw').value=''; showApp();
  }catch(e){ $('loginErr').textContent = e.message; }
}
async function logout(){ try{ await api('POST','/api/logout'); }catch{} location.reload(); }

function showApp(){
  $('loginView').classList.add('hide');
  $('appView').classList.remove('hide');
  loadList();
}

// ---- 一覧 ----
async function loadList(){
  const r = await api('GET','/api/snippets');
  CSRF = r.csrf || CSRF;
  SNIPPETS = r.snippets;
  // 保存/削除/ピン留め/再読込のたびにここを通るので、検索結果の memo はまとめて捨てる
  // (古い抜粋や消えたスニペットを返し続けないため)。
  searchMemo.clear();
  pruneTagFilter();   // 消えたタグを選んだままだと、一覧が常に0件になって抜け出せない
  renderFilterMenu(); // タグの顔ぶれと件数は一覧の内容で変わる
  renderList();
}
// 検索結果(サーバー)を表示中なら SEARCH_RESULTS を、未検索なら SNIPPETS を土台にして、
// 絞り込みと並び替え (visibleRows) を通した結果を描画する。
// SEARCH_RESULTS の各要素は {id,title,tags,created,updated,bytes,field,excerpt}。
function renderList(){
  const rows = visibleRows();
  // 詳細帯もここで更新する。openSnippet() は必ず renderList() を通るので選択の切替に追従し、
  // 保存/ピン/削除/再読込 (loadList) でも同じ経路で最新の値に直る。
  renderDetail();
  const list = $('list'); list.innerHTML='';
  if(rows.length===0){
    // 「1件も持っていない」のか「条件に合うものが無い」のかを区別する
    const msg = (filtersActive() || SEARCH_RESULTS !== null) ? T.noMatches : T.noSnippets;
    list.innerHTML = `<div class="empty" style="height:120px">${esc(msg)}</div>`;
    return;
  }
  for(const s of rows){
    const div = document.createElement('div');
    div.className = 'item'+(s.id===currentId?' active':'');
    // 本文のみのヒットには「本文」バッジをタイトルの隣に付ける (行から日付/タグ/抜粋が
    // 消えたので、これが無いと「本文にヒットした行」だと分からない)。抜粋は詳細帯側。
    const bodyBadge = (s.field==='body') ? `<span class="tag body">${esc(T.bodyBadge)}</span>` : '';
    const pinTitle = s.pinned ? T.unpinTitle : T.pinTitle;
    div.innerHTML = `<button type="button" class="pin-item${s.pinned?' pinned':''}" title="${esc(pinTitle)}" aria-label="${esc(pinTitle)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
      <button type="button" class="dl-item" title="${esc(T.downloadTitle)}" aria-label="${esc(T.downloadTitle)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/></svg></button>
      <button type="button" class="del-item" title="${esc(T.delete)}" aria-label="${esc(T.delete)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      <div class="t"><span class="t-text">${esc(s.title)}</span>${bodyBadge}</div>`;
    div.querySelector('.pin-item').onclick = (e)=>{ e.stopPropagation(); togglePin(s.id, !s.pinned); };
    div.querySelector('.dl-item').onclick = (e)=>{ e.stopPropagation(); downloadSnippet(s.id); };
    div.querySelector('.del-item').onclick = (e)=>{ e.stopPropagation(); delById(s.id, s.title); };
    div.onclick = ()=>openSnippet(s.id);
    div.dataset.id = s.id;
    // 並べ替えは通常一覧のみ (検索結果の並びはサーバー側の表示順なのでドラッグ対象外)。
    // 並び替え/絞り込みが効いている間も外す (dragEnabled の定義にある理由による)。
    if(SEARCH_RESULTS === null && dragEnabled()) enableDrag(div, s);
    list.appendChild(div);
  }
}

// プレビュー上部の詳細帯。一覧の行から外した 更新日/バイト数/タグ を選択中のスニペットについて出す。
// 本文検索中でその行が本文ヒットなら抜粋も添える。未選択なら帯ごと隠す (.tabs と同じ扱い)。
// メタ情報は常に最新の SNIPPETS を正とし、抜粋だけ検索結果側から拾う
// (検索結果は検索した時点のスナップショットなので、保存直後は古い値を持ちうる)。
function renderDetail(){
  const bar = $('detail');
  const hit = (currentId && SEARCH_RESULTS !== null) ? SEARCH_RESULTS.find(x=>x.id===currentId) : null;
  const s = currentId ? (SNIPPETS.find(x=>x.id===currentId) || hit) : null;
  if(!s){ setDetailHtml(bar, ''); bar.style.display='none'; return; }
  const tagList = (s.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
  // タグは2行を超えるとCSS側で切られるので、全量は title 属性で読めるようにしておく
  const tags = tagList.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  // 抜粋の枠は「本文検索が走る長さ (2文字以上)」の間は中身が空でも置いておく。
  // 打鍵直後はローカル絞り込みが excerpt を空にするので、枠ごと消すと 150ms 後の
  // サーバー応答で戻るまでの間だけ帯が縮み、プレビューが打鍵のたびに上下に跳ねる。
  const exHtml = hit && hit.excerpt ? highlight(hit.excerpt, SEARCH_Q) : '';
  const ex = (exHtml || (SEARCH_Q||'').trim().length >= 2) ? `<div class="d-excerpt">${exHtml}</div>` : '';
  setDetailHtml(bar, `<span>${esc(fmtDate(s.updated))}</span><span>${esc(fmtBytes(s.bytes))}</span>`
    + (tags ? `<span class="d-tags" title="${esc(tagList.join(', '))}">${tags}</span>` : '') + ex);
  bar.style.display = 'flex';
}

// 帯は aria-live なので、同じ中身を書き戻すだけでも読み上げが走る。
// renderList() は検索の打鍵ごとに呼ばれるため、実際に変わったときだけ差し替える。
function setDetailHtml(bar, html){
  if(DETAIL_HTML === html) return;
  DETAIL_HTML = html;
  bar.innerHTML = html;
}

// 抜粋内の検索語を <mark> でハイライト (まず esc してから安全に置換)。
function highlight(text, q){
  const safe = esc(text);
  const needle = (q||'').trim();
  if(needle.length < 2) return safe;
  const escQ = esc(needle).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try{
    return safe.replace(new RegExp(escQ, 'gi'), m=>`<mark>${m}</mark>`);
  }catch{ return safe; }
}

// ---- 表示 ----
function openSnippet(id){
  currentId = id;
  renderList(); // 選択行のハイライトと、プレビュー上部の詳細帯 (renderDetail) をここで更新する
  $('emptyState').classList.add('hide');
  // タブ枠はモバイルの「← 一覧」ボタン用途のみ。PCでは出さない。
  $('tabs').style.display = window.matchMedia('(max-width:760px)').matches ? 'flex' : 'none';
  showPreview();

  if(window.matchMedia('(max-width:760px)').matches){
    $('content').classList.remove('hidden-mobile');
    $('sidebar').classList.add('collapsed');
  }
}
function showPreview(){
  // 読み込み完了まで透明にしておき、load 後に .loaded でフェードインさせる。
  const f = $('frame'); f.classList.remove('hide','loaded');
  f.onload = ()=> f.classList.add('loaded');
  // プレビューは sandbox iframe。srcに同一オリジンのpreviewエンドポイントを指定。
  f.src = '/api/snippets/'+currentId+'/preview';
}

// ---- 新規/編集 ----
function openModal(edit){
  editingId = edit ? currentId : null;
  $('modalTitle').textContent = edit ? T.modalEditTitle : T.modalNewTitle;
  $('modalErr').textContent='';
  $('mFile').value='';
  if(edit){
    const s = SNIPPETS.find(x=>x.id===currentId);
    $('mTitle').value = s.title||''; $('mTags').value = s.tags||'';
    api('GET','/api/snippets/'+currentId+'/raw').then(t=>$('mHtml').value=t).catch(()=>{});
  }else{
    $('mTitle').value=''; $('mTags').value=''; $('mHtml').value='';
  }

function closeModal(){ $('modal').classList.remove('show'); document.body.classList.remove('modal-open'); }

async function save(){
  $('modalErr').textContent='';
  const file = $('mFile').files[0];
  try{
    if(editingId){
      await api('PUT','/api/snippets/'+editingId, {
        title: $('mTitle').value, tags: $('mTags').value, html: $('mHtml').value
      });
    } else if(file){
      const fd = new FormData();
      fd.append('file', file);
      fd.append('title', $('mTitle').value || file.name.replace(/\.html?$/i,''));
      fd.append('tags', $('mTags').value);
      await api('POST','/api/snippets', fd, true);
    } else {

        title: $('mTitle').value, tags: $('mTags').value, html: $('mHtml').value
      });
    }
    closeModal();
    await loadList();
    if(editingId && currentId) showPreview();
    toast(T.toastSaved);
  }catch(e){ $('modalErr').textContent = e.message; }
}

// 削除は破壊操作なので confirm() は残す (トーストは結果の通知だけ担う)
async function delById(id, title){
  if(!confirm(T.confirmDelete.replace('{title}', title || T.untitled))) return;
  try{
    await api('DELETE','/api/snippets/'+id);
    if(currentId===id){
      currentId=null;
      $('tabs').style.display='none';
      $('detail').style.display='none'; // 一覧の再読込を待たずに帯を畳む
      $('frame').classList.remove('loaded');
      $('frame').classList.add('hide'); $('frame').src='about:blank';
      $('emptyState').classList.remove('hide');
      // モバイルでは一覧に戻す
      $('content').classList.add('hidden-mobile');
      $('sidebar').classList.remove('collapsed');
    }
    await loadList();
    toast(T.toastDeleted);
  }catch(e){ toast(e.message, true); }
}

// ---- ドラッグ&ドロップ並べ替え ----
// ピン留めグループと非ピングループは別々に扱う: 同じグループの項目の上でだけ
// ドロップを受け付ける(グループを跨ぐ移動は不可 = ピン状態はドラッグでは変わらない)。
// ドラッグ中は DOM ノードを直接動かしてプレビューし、dragend で確定した表示順を
// PUT /api/snippets/order に送って保存する。
let dragEl = null, dragSnip = null, dragDirty = false;
// スニペットのドラッグ中はドキュメント全体でドロップを「成立」として受け入れる。
// 項目の上以外(隙間・ドラッグ中の要素自身・別グループ・プレビュー側)で離すと
// ドロップ不成立(dropEffect=none)になり、ブラウザ標準の「残像が元の位置へ飛んで
// 戻る」スナップバックアニメーションが再生されてしまうため。並びは dragover の
// ライブプレビューで確定済みなので、どこで離しても成立扱いで問題ない。
// (グループを跨ぐ移動の禁止は項目側 dragover の挿入ロジックで担保されている)
document.addEventListener('dragover', (e)=>{
  if(!dragEl) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
document.addEventListener('drop', (e)=>{ if(dragEl) e.preventDefault(); });
function enableDrag(div, s){
  div.draggable = true;
  div.addEventListener('dragstart', (e)=>{
    dragEl = div; dragSnip = s; dragDirty = false;
    div.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', s.id); }catch{}
  });
  div.addEventListener('dragover', (e)=>{
    if(!dragEl || dragEl === div) return;
    if(!!dragSnip.pinned !== !!s.pinned) return; // グループを跨ぐドロップは受け付けない
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    // マウス位置が対象の上半分なら前へ、下半分なら後ろへ挿入 (ライブプレビュー)
    const r = div.getBoundingClientRect();
    const before = (e.clientY - r.top) < r.height / 2;
    const parent = div.parentNode;
    if(before && div.previousElementSibling !== dragEl){ parent.insertBefore(dragEl, div); dragDirty = true; }
    else if(!before && div.nextElementSibling !== dragEl){ parent.insertBefore(dragEl, div.nextElementSibling); dragDirty = true; }
  });
  div.addEventListener('drop', (e)=>e.preventDefault());
  div.addEventListener('dragend', ()=>{
    div.classList.remove('dragging');
    dragEl = null; dragSnip = null;
    if(dragDirty){ dragDirty = false; persistOrder(); }
  });
}
async function persistOrder(){
  // DOM の並び (= ドロップ後の表示順) を確定順として全IDを送る
  const ids = [...$('list').children].map(el=>el.dataset.id).filter(Boolean);
  const pos = new Map(ids.map((id,i)=>[id,i]));
  SNIPPETS.sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0));
  try{
    await api('PUT','/api/snippets/order', { ids });
  }catch{
    toast(T.toastOrderFailed, true);
    await loadList(); // 保存に失敗したらサーバー側の並びに戻す
  }
}

// ---- ピン留め (幾つでも可。一覧の先頭に固定表示される) ----
async function togglePin(id, pinned){
  try{
    await api('PUT','/api/snippets/'+id, { pinned });
    await loadList();
    if(SEARCH_RESULTS !== null) await runSearch(); // 検索表示中は結果側も更新する
  }catch(e){ toast(e.message, true); }
}

// ---- エクスポート (スニペットを1ファイルずつHTMLでダウンロード) ----
// サーバーが Content-Disposition: attachment で返すので、スマホでもそのまま保存できる。
function downloadSnippet(id){
  const a = document.createElement('a');
  a.href = '/api/snippets/'+id+'/download';
  a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

// ---- ユーティリティ ----
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ms){ const d=new Date(ms); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtBytes(b){ if(b<1024) return b+'B'; if(b<1024*1024) return (b/1024).toFixed(1)+'KB'; return (b/1048576).toFixed(1)+'MB'; }

// ---- イベント ----
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
// メニュー項目はどれも押したらメニューを畳む (logout は reload するが、
// 畳まないままだと将来その場でログイン画面へ戻したときにメニューが開きっぱなしになる)
$('logoutBtn').onclick = ()=>{ setAccountMenu(false); logout(); };
// ---- メニュー (ヘッダの「⋯」/ 並び替え / 絞り込み で共通) ----
// 3つとも「トリガーボタン + role="menu"」という同じ形をしている。開閉・矢印キー移動・
// 外側クリック・Escape を個別に書くと、片方だけ閉じ残るような食い違いが出るので1組に集約する。
const MENUS = [
  { menu:'accountMenu', btn:'menuBtn' },
  { menu:'sortMenu',    btn:'sortBtn' },
  { menu:'filterMenu',  btn:'filterBtn' },
];
// 絞り込みメニューは選択のたびに innerHTML を差し替える。その瞬間に飛ぶ focusout で
// 閉じてしまわないよう、再描画中だけ focusout を無視する。
let menuRerendering = false;
// UI_HIDE_NEW=1 では #newBtn が display:none になる。隠れた項目へ focus() しても
// 何も起きずフォーカスが迷子になるので、フォーカス移動は必ずこの一覧を通す。
// 「タグがありません」の案内は <div>(aria-disabled) で、フォーカスは持たせないので除く。
function visibleMenuItems(menuEl){
  return Array.prototype.filter.call(menuEl.querySelectorAll('.menu-item'),
    el=>el.tagName === 'BUTTON' && el.offsetParent !== null);
}
function setMenu(menuEl, btnEl, open){
  menuEl.classList.toggle('hide', !open);
  btnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
  // 先頭の項目ではなく「表示されている最初の項目」へ
  if(open){ const items = visibleMenuItems(menuEl); if(items.length) items[0].focus(); }
}
function closeMenus(){ for(const m of MENUS) setMenu($(m.menu), $(m.btn), false); }
// 開いているメニューの定義 (無ければ null)。Escape と n キーの判定に使う。
function openMenu(){ return MENUS.find(m=>!$(m.menu).classList.contains('hide')) || null; }
// アカウントメニューは項目側からも畳むので、呼びやすい形を用意しておく
function setAccountMenu(open){ setMenu($('accountMenu'), $('menuBtn'), open); }
// role="menu" を名乗る以上、上下/Home/End での移動を用意する。スクリーンリーダーは
// menu ロールを見るとアプリケーションモードに入って矢印キーを奪うため、Tab だけでは
// 「メニューとして操作できる」という約束を果たせない。
function moveMenuFocus(e, menuEl){
  const key = e.key;
  if(key !== 'ArrowDown' && key !== 'ArrowUp' && key !== 'Home' && key !== 'End') return;
  const items = visibleMenuItems(menuEl);
  if(!items.length) return;
  e.preventDefault(); // 矢印キーで背後の一覧ごとスクロールさせない
  const cur = items.indexOf(document.activeElement);
  let next;
  if(key === 'Home') next = 0;
  else if(key === 'End') next = items.length - 1;
  else if(key === 'ArrowDown') next = cur < 0 ? 0 : (cur + 1) % items.length;
  else next = cur < 0 ? items.length - 1 : (cur - 1 + items.length) % items.length;
  items[next].focus();
}
for(const m of MENUS){
  const menuEl = $(m.menu), btnEl = $(m.btn);
  menuEl.addEventListener('keydown', (e)=>moveMenuFocus(e, menuEl));
  // Tab でメニューの外へ出たら閉じる (フォーカストラップは張らない)
  menuEl.addEventListener('focusout', (e)=>{
    if(menuRerendering) return; // 中身の作り直しで一瞬フォーカスが外れるだけ
    if(!menuEl.contains(e.relatedTarget) && e.relatedTarget !== btnEl) setMenu(menuEl, btnEl, false);
  });
  // stopPropagation しないと、直後に document の click が拾って開いた瞬間に閉じてしまう
  btnEl.onclick = (e)=>{
    e.stopPropagation();
    const willOpen = menuEl.classList.contains('hide');
    closeMenus(); // 別のメニューが開いていたら畳んでから開く (2つ同時に開かせない)
    if(willOpen) setMenu(menuEl, btnEl, true);
  };
}
document.addEventListener('click', (e)=>{
  // 絞り込みの項目を押すと renderFilterMenu() が中身を作り直すため、この時点で e.target は
  // DOM から切り離されている。切り離された要素の closest() は祖先を辿れず null を返すので、
  // 「メニューの外を押した」と誤判定して、開いたまま使いたいメニューまで畳んでしまう。
  if(!e.target.isConnected) return;
  if(!e.target.closest('.menu-wrap,.fb-wrap')) closeMenus();
});

// 並び替えは単一選択なので、選んだら閉じてトリガーへフォーカスを戻す。
$('sortMenu').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-sort]');
  if(!el) return;
  setSort(el.dataset.sort);
  setMenu($('sortMenu'), $('sortBtn'), false);
  $('sortBtn').focus();
});
// 絞り込みは続けて選べるように開いたままにする。項目は renderFilterMenu() が作り直すので、
// 押した位置と同じ番号の項目へフォーカスを戻す (「解除」は押すと項目ごと消えるのでボタンへ)。
$('filterMenu').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-tag],[data-pinned],[data-clear]');
  if(!el) return;
  const items = ()=>Array.prototype.slice.call($('filterMenu').querySelectorAll('.menu-item'));
  const idx = items().indexOf(el);
  if(el.dataset.clear) clearFilters();
  else if(el.dataset.pinned) setPinnedOnly(!PINNED_ONLY);
  else toggleTag(el.dataset.tag);
  renderFilterMenu();
  renderList();
  const back = items()[idx];
  if(back && back.tagName === 'BUTTON') back.focus();
  else { setMenu($('filterMenu'), $('filterBtn'), false); $('filterBtn').focus(); }
});

// ---- キーボード操作 (document の keydown はこの1本だけ) ----
// 上のレイヤーから順に処理して return する。ショートカットを足すときもこの構造を崩さない。
// リスナを複数並べると Escape 一発で別々のUIが同時に閉じるなど、順序に依存した壊れ方をする。
function handleKey(e){
  // IME 変換中のキーは拾わない (変換確定の Enter/Escape、および「ん」の入力途中など)。
  if(e.isComposing || e.keyCode === 229) return;
  if(e.key === 'Escape'){
    // 開いているメニュー (⋯ / 並び替え / 絞り込み) があれば、まずそれを畳む
    const om = openMenu();
    if(om){ setMenu($(om.menu), $(om.btn), false); $(om.btn).focus(); return; }
    // モーダルの可視状態は .overlay.show で表現されている (#modal に .hide は付かない)
    if($('modal').classList.contains('show')){ closeModal(); return; }
    return;
  }
  // n: 新規作成。UI_HIDE_NEW=1 でメニューの「新規作成」を隠したときの代替導線を兼ねる。
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key !== 'n') return;
  if($('appView').classList.contains('hide')) return; // 未ログイン (ログイン画面) では効かせない
  if(openMenu()) return; // いずれかのメニューを開いている間は効かせない
  const el = e.target;
  if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
  if($('modal').classList.contains('show')) return; // 多重に開かない
  e.preventDefault();
  openModal(false);
}
document.addEventListener('keydown', handleKey);
let searchTimer = null;
let searchAbort = null; // 進行中の検索リクエスト
let searchSeq = 0;      // 発行順。古い応答が後勝ちで上書きするのを防ぐ
let composing = false;  // IME変換中か (isComposing が揺れる環境向けの保険)
// 同じクエリの再入力 (バックスペースで消して打ち直す等) でサーバーへ投げ直さないための memo。
// 内容が変わりうる操作 (保存/削除/ピン留め/再読込) の後は loadList() でまとめて捨てる。
const SEARCH_MEMO_MAX = 50;
const searchMemo = new Map(); // q -> { results, truncated, scanned }
function memoPut(q, payload){
  if(searchMemo.has(q)) searchMemo.delete(q);
  searchMemo.set(q, payload);
  // 挿入順に古いものから捨てる (Map は挿入順を保つ)
  while(searchMemo.size > SEARCH_MEMO_MAX) searchMemo.delete(searchMemo.keys().next().value);
}

// 計測は ?debug=perf のときだけ。通常アクセスでは performance.* を1回も呼ばない。
const PERF = (function(){ try{ return location.search.indexOf('debug=perf') !== -1; }catch{ return false; } })();
function perfMark(name){ if(PERF){ try{ performance.mark(name); }catch{} } }
function perfMeasure(name, from, to){
  if(!PERF) return;
  try{
    const m = performance.measure(name, from, to);
    console.table([{ measure: name, ms: Math.round(m.duration * 100) / 100 }]);
  }catch{}
}

function setSearchStatus(text){
  const el = $('searchStatus');
  el.textContent = text || '';
  el.classList.toggle('hide', !text);
}

// 検索は2段構え。
//  1. タイトル/タグは手元の SNIPPETS だけで絞り込んで同期で描画する (ネットワーク往復なし)。
//     1文字目から効く。
//  2. 本文検索だけを ~150ms デバウンスでサーバーへ投げ、届いた時点で結果を丸ごと差し替える
//     (サーバー結果はローカル結果の上位集合とは限らないため、マージせず置き換える)。
// 手元の SNIPPETS のタイトル/タグだけを絞り込む。サーバー応答の待ち時間が無い。
// 並びは filter だけで作る (sort しない) — 表示順はサーバーが決めているため、
// ここで並べ替えると本文検索の結果が届いた瞬間に順序が飛ぶ。
function applyLocalFilter(q){
  SEARCH_Q = q;
  if(!q){
    SEARCH_RESULTS = null; // 全件表示に戻す
    renderList();
    return;
  }
  const needle = q.toLowerCase();
  SEARCH_RESULTS = SNIPPETS.filter(s=>
    (s.title||'').toLowerCase().includes(needle) || (s.tags||'').toLowerCase().includes(needle)
  ).map(s=>({ ...s, field:'title', excerpt:'' }));
  renderList();
}

function showBodyResults(payload){
  SEARCH_RESULTS = payload.results;
  // 打ち切られた場合は黙って結果を欠かさず、対象件数を出す。
  setSearchStatus(payload.truncated ? T.searchTruncated.split('{n}').join(String(payload.scanned)) : '');
  renderList();
}

// 進行中の本文検索を無効化する。発行番号を進めてから打ち切るので、
// 「打ち切りが間に合わずに届いた応答」も seq 比較で捨てられる。
// 入力のたびに即座に呼ぶこと — デバウンス後の runBodySearch まで遅らせると、
// その隙間に古い応答が届いてローカル絞り込みの表示を上書きしてしまう。
function invalidateBodySearch(){
  const seq = ++searchSeq;
  if(searchAbort) searchAbort.abort();
  searchAbort = null;
  return seq;
}

// 本文検索 (サーバー)。タイトル/タグ側は applyLocalFilter が既に描画済み。
async function runBodySearch(){
  const q = $('search').value.trim();
  SEARCH_Q = q;
  const seq = invalidateBodySearch();
  // 1文字以下はローカル絞り込みのみ。ここでローカル結果を引き直しておく
  // (直前の表示が古い本文検索の結果だった場合に、現在のクエリへ確定させる)。
  if(q.length < 2){ setSearchStatus(''); applyLocalFilter(q); return; }
  const memo = searchMemo.get(q);
  if(memo){ showBodyResults(memo); return; }
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  searchAbort = ctl;
  setSearchStatus(T.searching);
  try{
    const r = await api('GET','/api/search?q='+encodeURIComponent(q), null, false, ctl && ctl.signal);
    // 応答が前後しても、最後に発行した検索の結果だけを採用する。
    // 検索欄の現在値とも突き合わせる (seq の更新漏れが起きても表示は守られる)。
    if(seq !== searchSeq || $('search').value.trim() !== q) return;
    CSRF = r.csrf || CSRF;
    const payload = { results: r.results || [], truncated: !!r.truncated, scanned: r.scanned || 0 };
    memoPut(q, payload);
    showBodyResults(payload);
    perfMark('hv:search:paint');
    perfMeasure('hv:search:body', 'hv:search:input', 'hv:search:paint');
  }catch(e){
    // 自分で打ち切ったものは失敗ではないので、表示を触らない。
    if(e && e.name === 'AbortError') return;
    if(seq !== searchSeq) return;
    // 本文検索が落ちても、ローカル絞り込みの結果はそのまま残す (以前のフォールバックと同じ内容)。
    setSearchStatus('');
  }
}
// 一覧の再取得/更新後に呼ばれる。旧 runSearch と同じ「今のクエリで引き直す」役割。
async function runSearch(){
  applyLocalFilter($('search').value.trim());
  await runBodySearch();
}
function onSearchInput(){
  perfMark('hv:search:input');
  // 入力した瞬間に、飛んでいる本文検索を無効化する。デバウンス後まで待つと、
  // その間に届いた古い応答が新しいローカル絞り込みを上書きする。
  invalidateBodySearch();
  applyLocalFilter($('search').value.trim());
  perfMark('hv:search:paint');
  perfMeasure('hv:search:local', 'hv:search:input', 'hv:search:paint');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runBodySearch, 150);
}
// IME変換中は中間状態ごとに検索しない。確定時 (compositionend) に1回だけ走らせる。
$('search').addEventListener('compositionstart', ()=>{ composing = true; });
$('search').addEventListener('compositionend', ()=>{ composing = false; onSearchInput(); });
$('search').oninput = (e)=>{ if(composing || (e && e.isComposing)) return; onSearchInput(); };
// メニュー項目なので、モーダルを開く前にメニューを畳む
// (開いたままだと Escape がモーダルではなくメニューに先に効く)
$('newBtn').onclick = ()=>{ setAccountMenu(false); openModal(false); };
$('mCancel').onclick = closeModal;
$('mSave').onclick = save;
// オーバーレイの余白 (モーダル本体の外) をクリックしたら閉じる
$('modal').addEventListener('mousedown', e=>{ if(e.target === $('modal')) closeModal(); });
$('backBtn').onclick = ()=>{
  $('content').classList.add('hidden-mobile');
  $('sidebar').classList.remove('collapsed');
};

// ---- サイドバーの折りたたみ/展開 (状態は localStorage に記憶。デスクトップ専用) ----
const LS_SB = 'hv:sbCollapsed';
function setSidebarCollapsed(c){ $('appView').classList.toggle('sb-collapsed', c); lsSet(LS_SB, c ? '1' : ''); }
$('collapseBtn').onclick = ()=>setSidebarCollapsed(true);
$('expandBtn').onclick = ()=>setSidebarCollapsed(false);
if(lsGet(LS_SB)==='1') setSidebarCollapsed(true);

// ---- サイドバー幅のドラッグ調整 (デスクトップのみ。幅は localStorage に記憶) ----
// 幅は必ず :root の --sb-w を書き換える。.sidebar へ直接当てると
// @media (max-width:760px) の width:100% に勝ってモバイルが固定幅になる。
const LS_SBW = 'hv:sbWidth';
const SB_MIN = 240, SB_MAX = 560;
let sbWidth = 340;
function setSidebarWidth(px){
  sbWidth = Math.min(SB_MAX, Math.max(SB_MIN, Math.round(px)));
  document.documentElement.style.setProperty('--sb-w', sbWidth+'px');
}
(function initSidebarResize(){
  const savedW = parseInt(lsGet(LS_SBW)||'', 10);
  if(Number.isFinite(savedW)) setSidebarWidth(savedW);
  const rz = $('sbResizer');
  let resizing = false;
  rz.addEventListener('pointerdown', (e)=>{
    if(window.matchMedia('(max-width:760px)').matches) return;
    resizing = true;
    try{ rz.setPointerCapture(e.pointerId); }catch{}
    e.preventDefault(); // ドラッグ中にテキスト選択が走らないように
  });
  rz.addEventListener('pointermove', (e)=>{ if(resizing) setSidebarWidth(e.clientX); });
  const end = (e)=>{
    if(!resizing) return;
    resizing = false;
    try{ rz.releasePointerCapture(e.pointerId); }catch{}
    lsSet(LS_SBW, String(sbWidth));
  };
  rz.addEventListener('pointerup', end);
  rz.addEventListener('pointercancel', end);
})();

// 並び替え/絞り込みのボタンは中身が JS 側にあるので、一覧を読む前にラベルだけ入れておく
// (タグの顔ぶれと件数は loadList() が renderFilterMenu() を呼び直して埋める)
renderSortMenu();
renderFilterMenu();
checkAuth();
</script>
