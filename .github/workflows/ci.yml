name: ci

# このリポジトリの品質ゲートの実体。
# docker.yml の Docker ビルドだけでは JS の構文エラーも i18n キー欠落も検出できないため、
# 検証ジョブ(check)と Workers 版の統合テスト(worker-smoke)を必須チェックとして分離する。
# Dependabot PR は人間の目を通さず自動マージされるので、ここの質がそのまま main の質になる。
#
# ジョブ名 check / worker-smoke はブランチ保護の required status checks に登録済み。
# 名前を変えると保護が空振りするので変更しない。
# audit は意図的に必須チェックに入れていない（理由は audit ジョブの直上に書いた）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR に追記コミットが続くと古い run が積み上がるので、PR のときだけ打ち切る。
# main への push は打ち切らない（連続マージで run が消えると「緑の履歴」が欠け、
# どのコミットが検証済みか後から追えなくなる）。docker.yml と同じ方針。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # サプライチェーン対策として各アクションはコミットSHAで固定（# 以降が対応バージョン）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install (Express edition)
        run: npm ci

      - name: Syntax check (追跡下の全 .js / .mjs)
        # 対象をハードコードすると、新しく追加された .mjs が検査対象から漏れる。
        # git の追跡ファイルから列挙すれば追加漏れが起きず、node_modules は
        # git 管理外なので何も書かなくても除外される。
        # -z / read -d '' はファイル名に空白が入っても壊れないようにするため。
        # パイプではなくプロセス置換にしているのは、サブシェルだと count が親に返らないため。
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(git ls-files -z '*.js' '*.mjs')
          echo "syntax checked: ${count} file(s)"
          # 列挙が壊れて0件でも成功扱いになる「空振り成功」を潰しておく
          if [ "$count" -eq 0 ]; then
            echo "::error::検査対象の .js / .mjs が1件も見つかりませんでした"
            exit 1
          fi

      - name: Inline JS check (HTML 内の <script>)
        # UI の実装の大半は public/index.template.html と worker/public/index.html の
        # インライン <script> にあり、node --check の対象外だった。
        # （行数は変動するのでここには書かない。実測値はチェッカーが実行時に出力する）
        # 構文エラーで画面が真っ白でも CI が緑になるので、専用チェッカーで塞ぐ。
        run: |
          set -euo pipefail
          npm run check:inline-js

      - name: i18n build (en / ja) — キー欠落を失敗扱いにする
        run: |
          set -euo pipefail
          for lang in en ja; do
            out="$(APP_LANG="$lang" node scripts/build-i18n.mjs 2>&1)"
            printf '%s\n' "$out"
            # build-i18n.mjs は未定義キーを warn するだけで exit 0 なので、CI 側で落とす
            # （scripts/build-i18n.mjs:37 の console.warn を検出）
            if printf '%s' "$out" | grep -q '未定義のプレースホルダ'; then
              echo "::error file=locales/${lang}.json::APP_LANG=${lang} でプレースホルダが未解決です"
              exit 1
            fi
          done

      - name: HTTP smoke (Express 版)
        # 以前は「GET / が 2xx か 3xx なら合格」だった。これは 500 以外を通すのと大差なく、
        # ログイン・CSRF・レート制限が壊れていても緑になる。
        # test/http-smoke.mjs は worker 版と同じ粒度でエンドポイントの契約を検証する。
        #
        # env を渡していないのは意図的。このテストは自己完結していて、
        # DATA_DIR(mkdtemp) / PORT / SESSION_SECRET / AUTH_PASSWORD をすべて自前で決め、
        # server.js の起動と停止も持つ。i18n のビルドもテスト内で走らせる。
        # ここで環境変数を足すと期待値と食い違うだけなので何も渡さない。
        run: |
          set -euo pipefail
          npm test

  # ---------------------------------------------------------------------------
  # audit は required status check に登録してはいけない。
  #
  # npm audit の結果はリポジトリの中身ではなく、npm advisory DB の内容と
  # registry.npmjs.org の可用性という外部の可変入力で決まる。これを必須チェックにすると、
  # express や helmet に high 勧告が新規公開された瞬間、あるいはレジストリが一時的に落ちた
  # だけで、脆弱性と無関係な PR まで含めて全オープン PR のマージが一律で止まる。
  # 「リポジトリを直せば緑にできる」性質を持たないものを必須チェックにしない、という判断。
  #
  # このジョブは PR 画面で赤く見えるだけで、マージはブロックしない位置づけ。
  # 依存の更新そのものは Dependabot の役割で、そこで上げた PR を check が検証する。
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # npm audit は package-lock.json さえあれば npm ci なしで走る。
      # 依存のインストールが要らないぶん check とは独立に短時間で回せる。
      - name: npm audit (Express edition / 本番依存のみ)
        # --omit=dev の理由: devDependencies の脆弱性は配布物（Docker イメージ /
        # Workers バンドル）に載らない。ここで見たいのは利用者に届く依存だけ。
        # --audit-level=high 未満（moderate 以下）は報告を止めるほどではないので通す。
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: npm audit (Workers edition / 本番依存のみ)
        working-directory: worker
        # 正直に書いておくと、このステップは現時点では空振りする。
        # worker/package.json は dependencies を持たず devDependencies: { wrangler } だけなので、
        # --omit=dev を付けた時点で監査対象が空になり、必ず 0 件で通る。
        # 残しているのは、将来 worker に本番依存が入ったときに自動で監査が効き始める保険として。
        #
        # wrangler(devDep) 経由では sharp の high が出るが、wrangler はビルド時ツールで
        # Workers バンドルには載らないため意図的に対象外にしている（我々の手では直せず、
        # 対象に含めると CI が恒常的に赤くなるだけ）。
        #
        # なお mcp/ は本番依存(@modelcontextprotocol/sdk, zod)を持つのに package-lock.json が
        # 無いため、npm audit の対象にできず現状は完全に監査外になっている。
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

  worker-smoke:
    name: worker-smoke
    # worker/test/http-smoke.mjs は CSRF 契約 / DEMO_MODE の 403 / セキュリティヘッダを検証する。
    # CONTRIBUTING.md の "Keep intact" を機械的に守らせる手段なので必須チェックに入れる。
    runs-on: ubuntu-latest
    # このテストは 3 フェーズそれぞれ最大 90 秒の起動待ちを持つので、悪条件だと1回で 4〜5 分かかる。
    # 下のリトライで最悪その2倍になるため、15 分だと余裕がない。20 分にしておく。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install (Workers edition)
        working-directory: worker
        run: npm ci

      - name: Seed .dev.vars
        working-directory: worker
        # http-smoke.mjs は .dev.vars に SESSION_SECRET と AUTH_HASH があることを前提にする
        # （ログインパスワードは HV_PASSWORD の既定値 demo-test-pass-1234 と一致させる）。
        #
        # setpass.mjs --local には pipe できない。readline を2回 createInterface しており、
        # 1回目の close() で消費済みの stdin から2回目が読めず、exit 0 のまま無言で終了する
        # （プロンプトだけ出て AUTH_HASH が書かれない）。CI ではハッシュを直接生成する。
        # 形式は worker/src/worker.js:64-68 の検証側に合わせる:
        #   {"iter":N,"salt":<base64url>,"hash":<base64url>} / PBKDF2-SHA256 / 256bit
        run: |
          set -euo pipefail
          printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const ITER = 100000; // workerd の PBKDF2 上限
            const b64u = (b) => Buffer.from(b).toString("base64")
              .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const km = await crypto.subtle.importKey(
              "raw", new TextEncoder().encode("demo-test-pass-1234"), "PBKDF2", false, ["deriveBits"]);
            const bits = await crypto.subtle.deriveBits(
              { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, km, 256);
            const record = JSON.stringify({ iter: ITER, salt: b64u(salt), hash: b64u(new Uint8Array(bits)) });
            writeFileSync(".dev.vars", "AUTH_HASH=" + record + "\n", { flag: "a" });
          '
          grep -q '^SESSION_SECRET=' .dev.vars
          grep -q '^AUTH_HASH=' .dev.vars

      - name: Run smoke test
        working-directory: worker
        # このテストは wrangler dev（workerd の実プロセス＋ポート待ち受け）に依存するため、
        # コードの不具合とは無関係にポート衝突や起動タイムアウトで落ちることがある。
        # 必須チェックなので、その手のノイズで PR を止めないよう1回だけ再試行する。
        #
        # 再試行では HV_PORT を変える。test/http-smoke.mjs は既定 8799 の固定ポートで
        # wrangler dev を起動するため、1回目が workerd のプロセス残留でポートを掴んだまま
        # 落ちた場合、同じポートで再試行しても同じ理由で落ちるだけで意味がない。
        # ポートをずらして初めて「ポート衝突による flaky」を救える。
        #
        # ただし再試行は不安定さを隠す行為なので、1回目の失敗はログと warning に必ず残す
        # （warning が続くようならリトライではなくテスト側を直す合図）。
        # 新しい retry アクションは足さない（SHA ピン留めの管理対象を増やさないため）。
        run: |
          set -euo pipefail
          if npm test; then
            exit 0
          fi
          echo "::warning::worker-smoke が1回目(HV_PORT=8799)で失敗したため HV_PORT=8899 で再試行する（flaky か本物の失敗かはログを確認すること）"
          HV_PORT=8899 npm test
