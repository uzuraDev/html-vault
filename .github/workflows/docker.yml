name: docker

# main への push / v* タグで、マルチアーキ(amd64+arm64)イメージを GHCR にビルド&push。
# Pull Request は「配布」ではなく「Dockerfile が壊れていないかの検証」なので、
# push せず linux/amd64 だけをビルドする。arm64 は runner 上では QEMU エミュレーションになり
# 数倍遅い。毎日ボットが PR を作る運用では、その時間とコストが積み上がる割に
# 「Dockerfile が通るか」以上の情報を増やさない。
# ⚠️ publish 側（main / v* タグ）から arm64 を落とすことは絶対にしないこと。
#    Apple Silicon / Raspberry Pi の利用者がイメージを取れなくなる。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# PR に追記コミットが続くと、古い HEAD のビルドが無駄に走り続けるので、
# PR のときだけ古い run を打ち切る。main / タグの publish は絶対に打ち切らない。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン対策として各アクションはコミットSHAで固定（# 以降が対応バージョン）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR は amd64 のみ = runner ネイティブなのでエミュレータは要らない。
      # ⚠️ 将来 PR でも arm64 をビルドするように戻すなら、下の platforms だけでなく
      #    この if も必ず外すこと。QEMU 未登録のまま arm64 を組むと
      #    "exec format error" でビルドが落ちる。
      - name: Set up QEMU (for arm64)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # 画像名は ghcr.io/<owner>/<repo>（metadata-action が小文字化する）
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # PR は検証だけなので runner ネイティブの amd64 のみ。push する場合だけ arm64 を足す。
          # 三項の代用イディオム。真側が空文字列だと偽側に落ちる罠があるが、
          # ここは両側とも非空の固定文字列なので該当しない。
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
